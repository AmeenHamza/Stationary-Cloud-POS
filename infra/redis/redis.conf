# Redis configuration shared by local Docker and Railway (DEPLOYMENT.md §5).
# The password is injected at start (--requirepass) from the environment; never stored here.
maxmemory 256mb
# BullMQ requirement (DECISIONS.md ADR-007): every cache key carries a TTL instead.
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save ""
protected-mode yes
tcp-keepalive 60
