name: Deploy after CI
# DEPLOYMENT.md §6, ADR-044: after CI passes on a push to main, trigger the Render API deploy, then copy the
# same commit to the fork that Vercel builds. The fork is a mirror: anything committed only there is replaced.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  render:
    # A pull request from another repository's main branch also reports head_branch 'main', so the event and
    # the head repository are checked as well; otherwise its CI run could deploy its code.
    if: >-
      github.repository == 'Ifham-Ansari/Stationary-Cloud-POS' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error --retry 3 \
            --retry-delay 5 --connect-timeout 10 --max-time 60 \
            -X POST "$RENDER_DEPLOY_HOOK_URL"

  vercel-fork:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Copy it to the fork's main branch
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$FORK_SYNC_TOKEN"
          git push --force \
            "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/AmeenHamza/Stationary-Cloud-POS.git" \
            "${HEAD_SHA}:refs/heads/main"
